name: Publish on CurseForge

on:
  workflow_dispatch:

env:
  MINECRAFT_VERSION: 1.19.2
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_APITOKEN }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: curseforge_apiToken
    steps:
      - name: Check CURSEFORGE_APITOKEN Length
        run: |
          SECRET_LENGTH=$(echo -n "${{ secrets.CURSEFORGE_APITOKEN }}" | wc -m)
          echo "CURSEFORGE_APITOKEN length: $SECRET_LENGTH"
          if [ "$SECRET_LENGTH" -eq 0 ]; then
            echo "CURSEFORGE_APITOKEN is empty!"
            exit 1
          fi

      - name: Check Environment Variables
        run: env

      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch changelog from forge-1.16.5 branch
        run: |
          git fetch origin forge-1.16.5
          git checkout origin/forge-1.16.5 -- changelog.md
          
      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          distribution: "temurin"
          java-version: 17

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Set Release Name Environment Variable
        id: set_release_name
        run: |
          RELEASE_NAME=$(basename $(ls build/libs/*-all.jar))
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      - name: Publish (CurseForge)
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1118306
          curseforge-token: "${{ env.CURSEFORGE_TOKEN }}"
          version-type: beta
          changelog-file: changelog.md
          loaders: forge
          game-versions: "${{ env.MINECRAFT_VERSION }}"
          name: "${{env.RELEASE_NAME}}"
          files: |
            build/libs/${{ env.RELEASE_NAME }}
