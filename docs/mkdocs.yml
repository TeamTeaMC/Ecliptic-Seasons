site_name: Ecliptic Seasons
site_url: https://example.com
site_description: A documentation for Ecliptic Seasons project
site_author: jianzoushihu
repo_url: https://github.com/joe-vettek/Ecliptic-Seasons
repo_name: Ecliptic Seasons

theme:
  name: 'material'
  language: 'en'


nav:
  - ...

markdown_extensions:
  - toc:
      permalink: true
  - admonition

extra_css:
  - 'css/custom.css'
extra_javascript:
  - 'js/custom.js'

docs_dir: 'source'

extra:
  static_path: ['_static']
  alternate:
    - name: English
      link: /en/latest/
      lang: en
    - name: 中文
      link: /en/latest/zh/
      lang: zh
plugins:
  - search
  - awesome-pages


